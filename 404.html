<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blazor CRM | DevExpress</title>
    <base href="/blazor-crm-demo-rtl/" />
    <link rel="icon" type="image/ico" href="favicon.ico" />
    <script>
        (function () {
            const isDark = /(?:^|;\s*)is-dark-theme=true(?:;|$)/.test(document.cookie);
            const mode = isDark ? "dark" : "light";
            const themeName = isDark ? "Fluent-Dark" : "Fluent-Light";
            const version = "26.2.0.0";
            for (const path of ["core", "global", `bootstrap/fluent-${mode}.bs5`, `modes/${mode}`, "accents/blue"])
                document.write(`<link rel="stylesheet" href="_content/DevExpress.Blazor.Themes.Fluent/${path}.min.css?v${version}" type="text/css" data-dx-theme="${themeName}">`);
        })();
    </script>
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="BlazorDemo.CRM.Static.styles.css" />
    <style>
        html, body, #app {
            height: 100%;
            margin: 0;
        }

        .boot-panel {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .boot-spinner {
            width: 2rem;
            height: 2rem;
            border: 0.25rem solid rgb(15 108 189 / 30%);
            border-bottom-color: rgb(15 108 189);
            border-radius: 50%;
            box-sizing: border-box;
            animation: boot-rotation 0.75s linear infinite;
        }

        @keyframes boot-rotation {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body class="medium-size">
    <div id="app">
        <div class="boot-panel">
            <span class="boot-spinner"></span>
        </div>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
